<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="{{{ COMPANY_NAME }}}">
  <meta name="theme-color" content="#36185e">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="icon" type="image/png" href="app-icon.png">
  <link rel="apple-touch-icon" href="app-icon.png">
  <style>
    @font-face { font-family: Beltz; src: url('original-font.ttf') format('truetype'); }
    * { box-sizing: border-box; }
    body { margin: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: #21142f; color: white; font: bold 16px Beltz, sans-serif; display: grid; place-items: center; height: 100vh; height: 100dvh; }
    main { position: relative; width: min(100%, 56.25vh); width: min(100%, 56.25dvh); height: 100%; min-height: 0; background: #36185e; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; background: linear-gradient(150deg, #7437d3, #36185e); text-align: center; padding: 24px; }
    #loading[hidden] { display: none; }
    #loading img { width: 112px; height: 112px; border-radius: 24px; }
    h1 { font-size: 36px; margin: 0; }
    progress { width: 180px; height: 8px; accent-color: white; }
    #company { opacity: .72; }
    #error { max-width: 100%; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <canvas id="unity-canvas" width="540" height="960" tabindex="0" aria-label="{{{ PRODUCT_NAME }}} puzzle game"></canvas>
    <div id="loading" role="status">
      <img src="app-icon.png" alt="">
      <h1>{{{ PRODUCT_NAME }}}</h1>
      <progress id="progress" max="1" value="0" aria-label="Loading game"></progress>
      <div id="company">{{{ COMPANY_NAME }}}</div>
      <div id="error" hidden></div>
    </div>
  </main>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    createUnityInstance(canvas, {
#if PROGRESSIVE_ASSET_LOADING
      primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
      secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // Keep Unity screen pixels aligned with CSS pixels for the 14px text floor.
      devicePixelRatio: 1
    }, value => { document.getElementById('progress').value = value; })
    .then(() => { document.getElementById('loading').hidden = true; canvas.focus(); })
    .catch(error => {
      document.getElementById('progress').hidden = true;
      const message = document.getElementById('error');
      message.hidden = false;
      message.textContent = 'Unable to start the game. Reload the page to try again.';
      console.error(error);
    });
  </script>
</body>
</html>
